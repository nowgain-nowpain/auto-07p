name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-13]
    steps:
    - uses: actions/checkout@v1
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install gfortran libmotif-dev libsoqt520-dev
        sudo apt-get install python3-matplotlib
        sudo apt-get install openmpi-bin libopenmpi-dev
        sudo apt-get install texlive texlive-latex-extra transfig
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew reinstall gfortran
        # workaround for brew link failure
        rm -f /usr/local/bin/{2to3-,idle,pydoc,python,pip}3*
        rm -f /usr/local/bin/python3*-config /usr/local/bin/2to3
        brew install cmake qt openmotif open-mpi coin3d
        curl -O -L https://github.com/coin3d/soqt/releases/download/v1.6.3/soqt-1.6.3-src.tar.gz
        tar xf soqt-1.6.3-src.tar.gz
        cd soqt/build
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
        make -j3
        sudo make install
        brew install basictex fig2dev
        brew install python-tk
        brew install python-matplotlib
    - name: Compile
      run: |
        # compile auto
        if [ "$RUNNER_OS" == "macOS" ]; then
          eval "$(/usr/libexec/path_helper)"
        fi
        ./configure --enable-gui --with-mpi
        make
        # compile manual
        make -C doc auto.pdf ../plaut04/doc/userguide.pdf
    - name: Run test (python3)
      run: |
        export OMPI_MCA_btl="^openib"
        cd test
        python3 ../python/auto all.auto
        mv *_log07p python3log.txt
    - uses: actions/upload-artifact@v4
      with:
        name: python3log-${{ matrix.os }}
        path: test/python3log.txt
    - uses: actions/upload-artifact@v4
      with:
        name: python3verification-${{ matrix.os }}
        path: test/verification
    - name: Run test (MPI + python3)
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          touch test/python3mpilog.txt
        else
          export AUTO_COMMAND_PREFIX="mpirun -n 2"
          export OMP_NUM_THREADS=1
          export OMPI_MCA_btl="^openib"
          cd test
          python3 ../python/auto all.auto
          mv *_log07p python3mpilog.txt
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: python3mpilog-${{ matrix.os }}
        path: test/python3mpilog.txt
    - uses: actions/upload-artifact@v4
      with:
        name: python3mpiverification-${{ matrix.os }}
        path: test/verification
    - name: Build wheel
      run: |
        python3 -m pip install --upgrade build
        python3 -m build --wheel
    - uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}
        path: dist/*.whl

  # CMake build lane: builds the core engine with CMake (instead of autotools)
  # and runs the demo suite against the CMake-produced lib/. Keeps CMake at
  # parity with the make build (refactor-plan.md W0). configure is still run
  # to generate the CLI's cmds/cmds.make runtime config (CMake will absorb that
  # in a later step); only the engine is built by CMake here.
  build-cmake:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v1
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran cmake python3-matplotlib python3-numpy
        sudo apt-get install -y openmpi-bin libopenmpi-dev
    - name: Generate CLI config (cmds.make) via configure
      run: ./configure
    - name: Build engine with CMake
      run: |
        # AUTO_BUILD_SHARED also produces lib/libauto.so (PIC) for the
        # Python-callback path (W4), built alongside the loose lib/*.o.
        cmake -S . -B build -DBUILD_DEMOS=OFF -DAUTO_BUILD_SHARED=ON
        cmake --build build -j
    - name: Run demo suite against the CMake-built lib/
      run: |
        export OMPI_MCA_btl="^openib"
        cd test
        python3 ../python/auto all.auto
        mv *_log07p cmake-python3log.txt
    - uses: actions/upload-artifact@v4
      with:
        name: cmake-python3log
        path: test/cmake-python3log.txt
    - uses: actions/upload-artifact@v4
      with:
        name: cmake-verification
        path: test/verification
    - name: Run Python-callback demos (no-compile path, W4)
      run: |
        # Runs each demos/pycallback/*.py two ways -- Python callbacks via
        # lib/libauto.so vs the compiled <name>.f90 + lib/*.o -- and checks the
        # b-files match. Needs libauto.so (built above) and gfortran (present).
        export AUTO_DIR="$PWD"
        export OMPI_MCA_btl="^openib"
        python3 test/test_pycallback.py
